[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timeweaver"
version = "0.1.0"
description = "A time series forecasting library with additive models for trend, seasonality, and holidays"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "holidays>=0.20",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
